<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limitless CMS · Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#F4F0E8', /* light */
                        accent: '#C8871E', /* gold-mid */
                        'accent-light': 'rgba(200, 135, 30, 0.1)',
                        surface: '#111218', /* pit */
                        muted: '#484A5C', /* smoke */
                        border: 'rgba(255,255,255,0.08)',
                        danger: '#ef4444',
                        success: '#22c55e',
                        void: '#0A0A0F'
                    },
                    boxShadow: {
                        'card': '0 10px 30px rgba(0,0,0,0.4)',
                        'card-hover': '0 20px 40px rgba(0,0,0,0.6), 0 0 20px rgba(200,135,30,0.1)',
                    },
                    fontFamily: {
                        display: ['Bebas Neue', 'sans-serif'],
                        mono: ['Space Mono', 'monospace'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #0A0A0F; color: #F4F0E8; }
        .font-display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.05em; }
        .font-mono { font-family: 'Space Mono', monospace; letter-spacing: 0.1em; text-transform: uppercase; }

        /* ── Password Gate ── */
        #auth-gate {
            position: fixed; inset: 0; z-index: 9999;
            background: #0A0A0F;
            display: flex; align-items: center; justify-content: center;
        }
        #auth-gate.hidden { display: none; }
        .auth-box {
            background: #111218; border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px; padding: 48px 40px;
            width: 100%; max-width: 380px;
            box-shadow: 0 32px 80px rgba(0,0,0,0.8);
            animation: authIn 0.4s cubic-bezier(0.16,1,0.3,1);
        }
        @keyframes authIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
        .auth-logo { width: 44px; height: 44px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; display:flex; align-items:center; justify-content:center; margin: 0 auto 24px; color: #C8871E; }
        .auth-title { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 0.05em; color: #F4F0E8; text-align: center; margin-bottom: 6px; }
        .auth-sub { font-size: 13px; color: #484A5C; text-align: center; margin-bottom: 32px; font-family: 'Space Mono', monospace; text-transform: uppercase; letter-spacing: 0.1em; }
        .auth-input {
            width: 100%; padding: 13px 16px;
            background: #0A0A0F; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; color: #F4F0E8; font-size: 15px; font-family: 'Space Mono', monospace;
            letter-spacing: 0.15em; outline: none;
            transition: border-color 0.15s;
            box-sizing: border-box;
        }
        .auth-input:focus { border-color: #C8871E; box-shadow: 0 0 0 2px rgba(200,135,30,0.2); }
        .auth-input::placeholder { color: #484A5C; letter-spacing: 0.05em; }
        .auth-btn {
            width: 100%; padding: 13px;
            background: #C8871E; color: #0A0A0F;
            border: none; border-radius: 8px;
            font-size: 13px; font-family: 'Space Mono', monospace; font-weight: bold; letter-spacing: 0.1em; text-transform: uppercase;
            cursor: pointer; margin-top: 16px;
            transition: all 0.15s;
        }
        .auth-btn:hover { background: #E8A832; box-shadow: 0 4px 12px rgba(200,135,30,0.3); }
        .auth-btn:active { transform: scale(0.98); }
        .auth-error { color: #ef4444; font-size: 12px; text-align: center; margin-top: 10px; min-height: 18px; font-family: 'Space Mono', monospace; }
        .auth-hint { color: #484A5C; font-size: 10px; text-align: center; margin-top: 24px; font-family: 'Space Mono', monospace; text-transform: uppercase; letter-spacing: 0.1em; }

        /* Sidebar */
        .sidebar { background: #111218; border-right: 1px solid rgba(255,255,255,0.08); }

        /* Card */
        .card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .card:hover { box-shadow: 0 12px 32px rgba(0,0,0,0.5), 0 0 15px rgba(200,135,30,0.05); transform: translateY(-2px); border-color: rgba(255,255,255,0.15); }

        /* Badge */
        .badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 4px; font-size: 10px; font-family: 'Space Mono', monospace; letter-spacing: 0.1em; text-transform: uppercase; }
        .badge-blue { background: rgba(200,135,30,0.1); color: #C8871E; border: 1px solid rgba(200,135,30,0.2); }
        .badge-green { background: rgba(34,197,94,0.1); color: #4ade80; border: 1px solid rgba(34,197,94,0.2); }
        .badge-gray { background: rgba(255,255,255,0.05); color: #F4F0E8; border: 1px solid rgba(255,255,255,0.1); }

        /* Input styles */
        .form-input {
            width: 100%; padding: 10px 14px;
            border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
            font-size: 14px; color: #F4F0E8; background: #0A0A0F;
            transition: all 0.2s; outline: none;
        }
        .form-input:focus { border-color: #C8871E; box-shadow: 0 0 0 2px rgba(200,135,30,0.15); background: #111218; }
        .form-input::placeholder { color: #484A5C; }

        /* Label */
        .form-label { display: block; font-size: 11px; font-family: 'Space Mono', monospace; color: #888; margin-bottom: 6px; letter-spacing: 0.1em; text-transform: uppercase; }

        /* Video input group */
        .video-input-group { display: flex; align-items: center; gap: 8px; }
        .video-input-group .form-input { flex: 1; }
        .preview-btn {
            flex-shrink: 0; padding: 10px 14px;
            border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
            background: rgba(255,255,255,0.03); color: #F4F0E8;
            cursor: pointer; font-size: 12px; font-family: 'Space Mono', monospace; letter-spacing: 0.05em;
            transition: all 0.2s; display: flex; align-items: center; gap: 6px;
        }
        .preview-btn:hover { border-color: #C8871E; color: #C8871E; background: rgba(200,135,30,0.1); }

        /* Tag input */
        .tag-wrap { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; background: #0A0A0F; min-height: 44px; cursor: text; transition: all 0.2s; }
        .tag-wrap:focus-within { border-color: #C8871E; box-shadow: 0 0 0 2px rgba(200,135,30,0.15); background: #111218; }
        .tag-chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; background: rgba(200,135,30,0.1); color: #C8871E; border-radius: 4px; font-size: 10px; font-family: 'Space Mono', monospace; border: 1px solid rgba(200,135,30,0.2); }
        .tag-chip button { color: #C8871E; cursor: pointer; display: flex; align-items: center; transition: color 0.15s; }
        .tag-chip button:hover { color: #ef4444; }
        .tag-input-inline { border: none; outline: none; background: transparent; font-size: 13px; color: #F4F0E8; min-width: 120px; }

        /* Modal */
        #modal-backdrop { display: none; background: rgba(10,10,15,0.8); }
        #modal-backdrop.open { display: flex !important; }
        #modal-panel { background: #111218; border: 1px solid rgba(255,255,255,0.08); }
        #modal-panel select { background-color: #0A0A0F; color: #F4F0E8; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #484A5C; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #888; }

        /* Nav tab active */
        .nav-tab.active { background: rgba(200,135,30,0.1); color: #C8871E; box-shadow: inset 2px 0 0 #C8871E; }
        .nav-tab { color: #888; transition: all 0.2s; font-family: 'Space Mono', monospace; text-transform: uppercase; letter-spacing: 0.1em; font-size: 11px !important; }
        .nav-tab:hover:not(.active) { background: rgba(255,255,255,0.05); color: #F4F0E8; }

        /* Toast */
        #toast { position: fixed; bottom: 32px; right: 32px; z-index: 9999; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        #toast > div { background: #111218; border: 1px solid rgba(200,135,30,0.3); color: #C8871E; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }

        /* Drag handle */
        .drag-handle { cursor: grab; color: #484A5C; transition: color 0.2s; }
        .drag-handle:hover { color: #F4F0E8; }

        /* Section header line */
        .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .section-header h3 { font-size: 11px; font-family: 'Space Mono', monospace; color: #888; letter-spacing: 0.15em; text-transform: uppercase; }

        /* Btn */
        .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: 6px; font-size: 11px; font-family: 'Space Mono', monospace; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; transition: all 0.2s; border: none; font-weight: bold; }
        .btn-primary { background: #C8871E; color: #0A0A0F; box-shadow: 0 4px 12px rgba(200,135,30,0.2); }
        .btn-primary:hover { background: #E8A832; transform: translateY(-1px); box-shadow: 0 6px 16px rgba(200,135,30,0.3); }
        .btn-outline { background: transparent; color: #F4F0E8; border: 1px solid rgba(255,255,255,0.15); box-shadow: none; }
        .btn-outline:hover { border-color: #C8871E; background: rgba(200,135,30,0.05); color: #C8871E; }
        .btn-danger { background: rgba(239,68,68,0.1); color: #ef4444; border: 1px solid rgba(239,68,68,0.2); }
        .btn-danger:hover { background: rgba(239,68,68,0.2); border-color: #ef4444; }
        .btn-sm { padding: 6px 12px; font-size: 10px; }
        .btn-icon { padding: 8px; border-radius: 8px; background: transparent; border: none; cursor: pointer; transition: all 0.2s; color: #888; }
        .btn-icon:hover { background: rgba(255,255,255,0.05); color: #F4F0E8; }

        /* Empty state */
        .empty-state { text-align: center; padding: 64px 32px; color: #484A5C; font-family: 'Space Mono', monospace; }
        .empty-state i { display: block; margin: 0 auto 16px; opacity: 0.5; color: #C8871E; }

        /* Category row */
        .cat-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; background: rgba(255,255,255,0.02); gap: 12px; transition: all 0.15s; }
        .cat-row:hover { border-color: rgba(200,135,30,0.3); background: rgba(200,135,30,0.05); }

        /* Stat card */
        .stat-card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 20px 24px; }
        .stat-value { font-size: 36px; font-family: 'Bebas Neue', sans-serif; color: #F4F0E8; letter-spacing: 0.05em; }
        .stat-label { font-size: 10px; font-family: 'Space Mono', monospace; color: #888; margin-top: 4px; letter-spacing: 0.15em; text-transform: uppercase; }

        /* Orientation badge */
        .orient-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 4px; font-size: 9px; font-family: 'Space Mono', monospace; font-weight: bold; text-transform: uppercase; letter-spacing: 0.1em;}
        .orient-landscape { background: rgba(34,197,94,0.1); color: #4ade80; border: 1px solid rgba(34,197,94,0.2); }
        .orient-portrait { background: rgba(168,85,247,0.1); color: #c084fc; border: 1px solid rgba(168,85,247,0.2); }
    </style>
</head>
<body class="text-brand flex h-screen overflow-hidden">

    <!-- ===== PASSWORD GATE ===== -->
    <div id="auth-gate">
        <div class="auth-box">
            <div class="auth-logo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            </div>
            <h1 class="auth-title">Limitless CMS</h1>
            <p class="auth-sub">Enter your admin password to continue</p>
            <input id="auth-input" class="auth-input" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')checkAuth()" autofocus>
            <button class="auth-btn" onclick="checkAuth()">Access Dashboard</button>
            <p class="auth-error" id="auth-error"></p>
            <p class="auth-hint">🔒 Secure admin access · Limitless Productions</p>
        </div>
    </div>

    <!-- Mobile Overlay -->
    <div id="mobile-overlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[15] hidden md:hidden" onclick="toggleSidebar()"></div>

    <!-- ===== SIDEBAR ===== -->
    <aside id="sidebar" class="sidebar w-64 md:w-60 flex flex-col justify-between h-full flex-shrink-0 z-20 absolute md:relative -translate-x-full md:translate-x-0 transition-transform duration-300 bg-white">
        <div>
            <!-- Logo -->
            <div class="h-16 flex items-center justify-between gap-3 px-6 border-b border-border">
                <div class="flex items-center gap-3">
                    <div class="w-7 h-7 border border-brand/20 rounded flex items-center justify-center text-accent bg-accent-light">
                        <i data-lucide="zap" class="w-4 h-4"></i>
                    </div>
                    <div>
                        <p class="font-display text-xl leading-none tracking-widest text-brand">LIMITLESS</p>
                        <p class="font-mono text-[8px] text-accent mt-0.5 tracking-widest">CONTENT MANAGER</p>
                    </div>
                </div>
                <button onclick="toggleSidebar()" class="md:hidden btn-icon">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Nav -->
            <nav class="p-3 space-y-0.5 mt-1">
                <button onclick="switchTab('overview')" class="nav-tab w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors active" id="tab-overview">
                    <i data-lucide="layout-dashboard" class="w-4 h-4 flex-shrink-0"></i> Overview
                </button>
                <button onclick="switchTab('projects')" class="nav-tab w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors" id="tab-projects">
                    <i data-lucide="film" class="w-4 h-4 flex-shrink-0"></i> Projects
                </button>
                <button onclick="switchTab('categories')" class="nav-tab w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors" id="tab-categories">
                    <i data-lucide="tag" class="w-4 h-4 flex-shrink-0"></i> Categories
                </button>
            </nav>
        </div>

        <!-- Footer -->
        <div class="p-5 border-t border-border space-y-2.5">
            <button onclick="saveToLocalStorage()" class="btn btn-primary w-full justify-center">
                <i data-lucide="save" class="w-4 h-4"></i> Save All Changes
            </button>
            <button onclick="exportData()" class="btn btn-outline w-full justify-center">
                <i data-lucide="download" class="w-4 h-4"></i> Export JSON
            </button>
            
            <div class="pt-2">
                <a href="index.html" class="flex items-center justify-center gap-2 w-full py-2.5 rounded text-[10px] font-mono tracking-widest text-muted hover:text-accent hover:bg-white/5 transition-colors border border-dashed border-white/20">
                    <i data-lucide="external-link" class="w-3 h-3"></i> VIEW MAIN SITE
                </a>
            </div>
        </div>
    </aside>

    <!-- ===== MAIN AREA ===== -->
    <main class="flex-1 h-full overflow-y-auto bg-void w-full relative">

        <!-- Topbar -->
        <header class="h-16 bg-surface border-b border-border sticky top-0 z-10 flex items-center justify-between px-4 md:px-8">
            <div class="flex items-center gap-2 md:gap-3">
                <button onclick="toggleSidebar()" class="md:hidden btn-icon mr-1">
                    <i data-lucide="menu" class="w-5 h-5 text-brand"></i>
                </button>
                <h2 class="font-display text-2xl tracking-widest text-brand" id="page-title">OVERVIEW</h2>
                <span id="page-subtitle" class="badge badge-gray text-xs hidden"></span>
            </div>
            <div class="flex items-center gap-2" id="header-actions">
                <!-- Dynamic actions injected -->
            </div>
        </header>

        <!-- Page Content -->
        <div class="p-4 md:p-8" id="content-area">
            <!-- Injected by JS -->
        </div>

    </main>

    <!-- ===== PROJECT EDIT MODAL ===== -->
    <div id="modal-backdrop" class="fixed inset-0 z-50 items-center justify-center p-4">
        <div id="modal-panel" class="rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-hidden flex flex-col border border-border">
            <div class="flex items-center justify-between px-6 py-4 border-b border-border flex-shrink-0 bg-surface">
                <h3 class="font-display text-xl tracking-widest text-brand" id="modal-title">EDIT PROJECT</h3>
                <button onclick="closeModal()" class="btn-icon text-muted hover:text-brand">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="overflow-y-auto flex-1 bg-void" id="modal-content">
                <!-- Form injected -->
            </div>
            <div class="flex items-center justify-between px-6 py-4 border-t border-border flex-shrink-0 bg-surface">
                <button onclick="closeModal()" class="btn btn-outline">CANCEL</button>
                <button onclick="saveProject()" class="btn btn-primary">
                    <i data-lucide="check" class="w-4 h-4"></i> SAVE PROJECT
                </button>
            </div>
        </div>
    </div>

    <!-- ===== VIDEO PREVIEW MODAL ===== -->
    <div id="video-preview-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[60] items-center justify-center p-4">
        <div class="relative max-w-sm w-full">
            <button onclick="closeVideoPreview()" class="absolute -top-10 right-0 text-white/70 hover:text-white flex items-center gap-2 text-sm">
                <i data-lucide="x" class="w-4 h-4"></i> Close
            </button>
            <div id="video-preview-container" class="rounded-xl overflow-hidden bg-black">
                <video id="preview-video" controls class="w-full max-h-[80vh]" style="object-fit: contain;"></video>
            </div>
            <p id="preview-label" class="text-white/50 text-xs text-center mt-3"></p>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div id="toast" class="translate-y-20 opacity-0">
        <div class="bg-brand text-white px-5 py-3 rounded-xl shadow-xl flex items-center gap-3 text-sm font-medium">
            <i data-lucide="check-circle" class="w-4 h-4 text-green-400"></i>
            <span id="toast-msg">Saved successfully</span>
        </div>
    </div>

    <!-- ===== CONFIRM DIALOG ===== -->
    <div id="confirm-dialog" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[70] items-center justify-center hidden">
        <div class="bg-surface rounded-xl border border-border shadow-2xl p-6 max-w-sm w-full mx-4">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 bg-red-500/10 border border-red-500/20 rounded flex items-center justify-center">
                    <i data-lucide="alert-triangle" class="w-5 h-5 text-red-500"></i>
                </div>
                <h3 class="font-display text-2xl tracking-widest text-brand">DELETE ITEM</h3>
            </div>
            <p class="text-sm text-muted mb-6 font-soft" id="confirm-msg">Are you sure you want to delete this? This cannot be undone.</p>
            <div class="flex gap-3">
                <button onclick="cancelConfirm()" class="btn btn-outline flex-1 justify-center">CANCEL</button>
                <button onclick="proceedConfirm()" class="btn bg-red-600 text-white flex-1 justify-center hover:bg-red-700 font-mono text-[11px] tracking-[0.1em] border-none">DELETE</button>
            </div>
        </div>
    </div>

    <script src="admin-seed.js"></script>
    <script src="admin.js"></script>
    <script type="module" src="firebase-admin.js"></script>
    <script>
        // ── Auth Gate Logic ────────────────────────────────
        // Change this password to anything you want
        const ADMIN_PASSWORD = 'LP@Universeisthelimit$10';

        (function initAuth() {
            if (sessionStorage.getItem('lp_auth') === 'ok') {
                document.getElementById('auth-gate').classList.add('hidden');
            }
        })();

        // Mobile Sidebar Toggle
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        function checkAuth() {
            const val = document.getElementById('auth-input').value;
            const err = document.getElementById('auth-error');
            if (val === ADMIN_PASSWORD) {
                sessionStorage.setItem('lp_auth', 'ok');
                const gate = document.getElementById('auth-gate');
                gate.style.opacity = '0';
                gate.style.transition = 'opacity 0.4s';
                setTimeout(() => gate.classList.add('hidden'), 400);
            } else {
                err.textContent = 'Incorrect password. Try again.';
                document.getElementById('auth-input').value = '';
                document.getElementById('auth-input').focus();
                document.querySelector('.auth-box').style.animation = 'none';
                setTimeout(() => { document.querySelector('.auth-box').style.animation = ''; }, 10);
            }
        }
    </script>
</body>
</html>
