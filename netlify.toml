[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build]
  publish = "."

# ── Long-lived immutable CSS (never changes without redeploy) ─
[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── JS files: 1-day fresh, 7-day stale (not immutable — filenames aren't hashed) ─
[[headers]]
  for = "/main.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# ── CMS & Firebase files: always fresh (content changes with every CMS save) ─
[[headers]]
  for = "/firebase-site.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/firebase-admin.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin-seed.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Admin portal: never cache, never indexed ──────────────────
[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag = "noindex, nofollow"

# ── Lazy-loaded HTML partials: 1h fresh, 24h stale ───────────
[[headers]]
  for = "/public/collage.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/public/fragments/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# ── Static images: 7-day fresh, 24h stale ────────────────────
[[headers]]
  for = "/public/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# ── Security headers on everything ───────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
