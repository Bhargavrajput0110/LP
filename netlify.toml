# ── Static files: serve directly, never redirect ─────────────
# These must come BEFORE the SPA catch-all below, so Netlify
# doesn't intercept fetch('/public/collage.html') and return index.html
[[redirects]]
  from = "/public/*"
  to = "/public/:splat"
  status = 200

[[redirects]]
  from = "/main.js"
  to = "/main.js"
  status = 200

[[redirects]]
  from = "/firebase-site.js"
  to = "/firebase-site.js"
  status = 200

[[redirects]]
  from = "/styles.css"
  to = "/styles.css"
  status = 200

# ── SPA fallback: only for routes with no real file ──────────
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build]
  publish = "."

# ── Long-lived immutable CSS (never changes without redeploy) ─
[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── JS files: always fresh on deploy ─────────────────────────
[[headers]]
  for = "/main.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── CMS & Firebase files: always fresh (content changes with every CMS save) ─
[[headers]]
  for = "/firebase-site.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/firebase-admin.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin-seed.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Admin portal: never cache, never indexed ──────────────────
[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag = "noindex, nofollow"

# ── Lazy-loaded HTML partials: 1h fresh, 24h stale ───────────
[[headers]]
  for = "/public/collage.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/public/fragments/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# ── Static images: 7-day fresh, 24h stale ────────────────────
[[headers]]
  for = "/public/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# ── Security headers on everything ───────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
